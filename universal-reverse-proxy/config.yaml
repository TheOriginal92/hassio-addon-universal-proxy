---
name: Universal Reverse Proxy
version: 0.2.13
slug: universal_reverse_proxy
description: Home Assistant Ingress reverse proxy add-on for externally hosted web apps via configurable subpaths (it does not run upstream apps itself)
url: https://github.com/pvillmann/hassio-addon-universal-proxy
arch:
  - armv7
  - aarch64
  - amd64
startup: application
panel_icon: mdi:swap-horizontal
panel_admin: false
boot: auto
stage: experimental
ingress: true
ingress_stream: true
ingress_port: 8099
init: true
timeout: 30
watchdog: http://[HOST]:[PORT:8099]
options:
  routes:
    - /evcc|http://evcc.local:7070
schema:
  routes:
    - str
